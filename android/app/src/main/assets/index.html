<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CALENDAR</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #141e30, #243b55);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
    transition: 0.4s;
}

body.light {
    background: linear-gradient(135deg, #74ebd5, #9face6);
}

.app {
    width: 100%;
    max-width: 450px;
    padding: 20px;
    border-radius: 32px;
    background: rgba(255,255,255,0.13);
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(25px);
    box-shadow: 0 25px 70px rgba(0,0,0,0.35);
}

/* HEADER */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.logoBox {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 52px;
    height: 52px;
    border-radius: 17px;
    background: rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}

.title {
    font-size: 22px;
    font-weight: bold;
}

.subtitle {
    font-size: 12px;
    opacity: 0.7;
    margin-top: 3px;
}

.theme {
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 17px;
    background: rgba(255,255,255,0.16);
    color: white;
    font-size: 21px;
    cursor: pointer;
}

/* CLOCK */

.clockBox {
    text-align: center;
    margin: 5px 0 22px;
}

.clock {
    font-size: 40px;
    font-weight: bold;
    letter-spacing: 2px;
}

.date {
    margin-top: 7px;
    opacity: 0.75;
    font-size: 14px;
}

/* MONTH */

.monthBox {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
}

.monthTitle {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
}

.arrow {
    width: 47px;
    height: 47px;
    border: none;
    border-radius: 16px;
    background: rgba(255,255,255,0.15);
    color: white;
    font-size: 28px;
    cursor: pointer;
    transition: 0.2s;
}

.arrow:hover {
    transform: scale(1.08);
    background: rgba(255,255,255,0.25);
}

/* WEEKDAYS */

.weekdays,
.days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
}

.weekdays div {
    text-align: center;
    font-size: 12px;
    opacity: 0.6;
    padding: 8px 0;
}

/* DAYS */

.day {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    cursor: pointer;
    transition: 0.2s;
    font-size: 15px;
}

.day:hover {
    background: rgba(255,255,255,0.2);
    transform: scale(1.05);
}

.today {
    background: white;
    color: #243b55;
    font-weight: bold;
    box-shadow: 0 6px 18px rgba(255,255,255,0.25);
}

.selected {
    outline: 2px solid white;
}

/* BOTTOM */

.todayButton {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: none;
    border-radius: 17px;
    background: white;
    color: #243b55;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.todayButton:hover {
    transform: translateY(-2px);
}

/* INFO */

.info {
    text-align: center;
    min-height: 24px;
    margin-top: 15px;
    font-size: 14px;
    opacity: 0.85;
}

/* FOOTER */

.footer {
    text-align: center;
    margin-top: 18px;
    font-size: 11px;
    opacity: 0.45;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">

        <div class="logoBox">

            <div class="logo">📅</div>

            <div>
                <div class="title">CALENDAR</div>
                <div class="subtitle">Тақвими замонавӣ</div>
            </div>

        </div>

        <button class="theme" onclick="toggleTheme()">🌙</button>

    </div>


    <div class="clockBox">

        <div class="clock" id="clock">
            00:00:00
        </div>

        <div class="date" id="currentDate">
            -
        </div>

    </div>


    <div class="monthBox">

        <button class="arrow" onclick="changeMonth(-1)">
            ‹
        </button>

        <div class="monthTitle" id="monthTitle">
            -
        </div>

        <button class="arrow" onclick="changeMonth(1)">
            ›
        </button>

    </div>


    <div class="weekdays">

        <div>Дш</div>
        <div>Сш</div>
        <div>Чш</div>
        <div>Пш</div>
        <div>Ҷм</div>
        <div>Шб</div>
        <div>Як</div>

    </div>


    <div class="days" id="days"></div>


    <button class="todayButton" onclick="goToday()">
        📍 Имрӯз
    </button>


    <div class="info" id="selectedInfo">
        Рӯзро интихоб кунед
    </div>


    <div class="footer">
        CALENDAR • 2026
    </div>

</div>


<script>

const months = [
    "Январ",
    "Феврал",
    "Март",
    "Апрел",
    "Май",
    "Июн",
    "Июл",
    "Август",
    "Сентябр",
    "Октябр",
    "Ноябр",
    "Декабр"
];

let current = new Date();


function updateClock() {

    const now = new Date();

    let h = String(now.getHours()).padStart(2, "0");
    let m = String(now.getMinutes()).padStart(2, "0");
    let s = String(now.getSeconds()).padStart(2, "0");

    document.getElementById("clock").textContent =
        h + ":" + m + ":" + s;


    document.getElementById("currentDate").textContent =
        now.toLocaleDateString("tg-TJ", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        });
}


function renderCalendar() {

    const year = current.getFullYear();
    const month = current.getMonth();

    document.getElementById("monthTitle").textContent =
        months[month] + " " + year;


    const container =
        document.getElementById("days");

    container.innerHTML = "";


    const firstDay =
        new Date(year, month, 1).getDay();

    const start =
        firstDay === 0 ? 6 : firstDay - 1;


    const daysInMonth =
        new Date(year, month + 1, 0).getDate();


    const today = new Date();


    for (let i = 0; i < start; i++) {

        const empty =
            document.createElement("div");

        container.appendChild(empty);
    }


    for (let day = 1; day <= daysInMonth; day++) {

        const item =
            document.createElement("div");

        item.className = "day";

        item.textContent = day;


        if (
            day === today.getDate() &&
            month === today.getMonth() &&
            year === today.getFullYear()
        ) {

            item.classList.add("today");
        }


        item.onclick = function () {

            document
                .querySelectorAll(".day")
                .forEach(function(el) {
                    el.classList.remove("selected");
                });


            item.classList.add("selected");


            const selected =
                new Date(year, month, day);


            document.getElementById(
                "selectedInfo"
            ).textContent =
                selected.toLocaleDateString("tg-TJ", {
                    weekday: "long",
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                });
        };


        container.appendChild(item);
    }
}


function changeMonth(value) {

    current.setMonth(
        current.getMonth() + value
    );

    renderCalendar();
}


function goToday() {

    current = new Date();

    renderCalendar();

    document.getElementById(
        "selectedInfo"
    ).textContent = "📍 Имрӯз";
}


function toggleTheme() {

    document.body.classList.toggle("light");

    const button =
        document.querySelector(".theme");


    if (
        document.body.classList.contains("light")
    ) {

        button.textContent = "☀️";

    } else {

        button.textContent = "🌙";
    }
}


updateClock();

setInterval(updateClock, 1000);

renderCalendar();

</script>

</body>
            </html>
